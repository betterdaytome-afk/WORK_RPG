name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載遊戲程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 與 Java 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 自動整理英文資源並打包 APK
        run: |
          mkdir -p www
          cp -r "工人職場/"* www/
          cd www
          [ -f "奧客.png" ] && mv "奧客.png" m1.png && sed -i 's/奧客\.png/m1.png/g' *.* || true
          [ -f "豬隊友同事.png" ] && mv "豬隊友同事.png" m2.png && sed -i 's/豬隊友同事\.png/m2.png/g' *.* || true
          [ -f "壞老闆.png" ] && mv "壞老闆.png" m3.png && sed -i 's/壞老闆\.png/m3.png/g' *.* || true
          cd ..
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "職場打工人" "com.work.rpg" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 匯出 APK 安裝包
        uses: actions/upload-artifact@v4
        with:
          name: WorkRPG-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
